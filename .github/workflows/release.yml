name: Publish release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing published GitHub release
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "The release tag must be a valid Docker tag." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
              echo "The tag must identify an existing published release." >&2
              exit 1
            fi
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          else
            sha="$GITHUB_SHA"
          fi
          {
            echo "tag=$TAG"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bibliotheca-app
            dockerfile: docker/app/Dockerfile
            context: .
          - image: bibliotheca-api
            dockerfile: docker/api/Dockerfile
            context: .
          - image: bibliotheca-web
            dockerfile: docker/web/Dockerfile
            context: .
          - image: bibliotheca-playwright
            dockerfile: docker/playwright/Dockerfile
            context: docker/playwright
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --tag "$image:$RELEASE_TAG" --push --file "$DOCKERFILE" "$CONTEXT"
          docker buildx imagetools inspect "$image:$RELEASE_TAG"
