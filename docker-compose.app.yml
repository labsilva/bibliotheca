services:
  app:
    image: ${APP_IMAGE:-bibliotheca-app:latest}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTPS_PORT:-8443}:443"
    restart: unless-stopped
    shm_size: ${APP_SHM_SIZE:-512mb}
    stop_grace_period: 30s
    cap_drop: [ALL]
    # The root supervisor only changes service identities and binds TLS ports.
    cap_add: [SETUID, SETGID, NET_BIND_SERVICE, KILL]
    # Read group-restricted direct TLS PEM files without DAC_OVERRIDE.
    group_add: ["1654"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/playwright/seccomp.json
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your public HTTPS origin}
      TLS_MODE: ${TLS_MODE:-proxy}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TLS_CERTIFICATE: ${TLS_CERTIFICATE:-/app/cert/tls/fullchain.pem}
      TLS_CERTIFICATE_KEY: ${TLS_CERTIFICATE_KEY:-/app/cert/tls/privkey.pem}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-25m}
      ConnectionStrings__SQLiteDefault: Data Source=/app/data/Bibliotheca.db
      Authentication__DataProtectionKeyPath: /app/data/keys
      Authentication__SigningCertificate__Path: /app/cert/signing.pfx
      Authentication__SigningCertificate__PasswordFile: /run/secrets/oidc_signing_password
      Authentication__EncryptionCertificate__Path: /app/cert/encryption.pfx
      Authentication__EncryptionCertificate__PasswordFile: /run/secrets/oidc_encryption_password
      Fetchers__TempFilesSaveLocation: /app/temp/
    secrets:
      - oidc_signing_password
      - oidc_encryption_password
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ${TEMP_PATH:-./temp}:/app/temp
      - ${CERT_PATH:-./cert}:/app/cert:ro
      - ${APPSETTINGS_PATH:-./appsettings.json}:/app/appsettings.json:ro

secrets:
  oidc_signing_password:
    file: ${OIDC_SIGNING_PASSWORD_FILE:-./secrets/oidc-signing-password}
  oidc_encryption_password:
    file: ${OIDC_ENCRYPTION_PASSWORD_FILE:-./secrets/oidc-encryption-password}
